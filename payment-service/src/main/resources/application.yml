spring:
  application:
    name: payment-service

  # ProblemDetail omits null fields (type, properties, instance) in every JSON error body.
  jackson:
    default-property-inclusion: non_null

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    # 29092 is the host listener of the dev Docker broker; containers use kafka:9092.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Bounded timeouts: the outbox poller runs on a scheduled thread, so an unreachable
        # broker must fail the tick in a few seconds instead of blocking for minutes.
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:3000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:3000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:6000}
    admin:
      # A missing broker must never stop the service from starting.
      fail-fast: false
      properties:
        default.api.timeout.ms: ${KAFKA_ADMIN_API_TIMEOUT_MS:5000}
        request.timeout.ms: ${KAFKA_ADMIN_REQUEST_TIMEOUT_MS:5000}

  # The container rejects an oversized upload before the controller runs. The service
  # also checks the size explicitly so the rule holds if these limits change.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8083
  error:
    include-message: never
    include-stacktrace: never

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: payment-service

sanaa:
  jwt:
    # Fetched lazily on the first token validation, so payment-service starts when auth-service is down.
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:sanaa-auth}
    audience: ${JWT_AUDIENCE:sanaa-api}

  payment:
    # Price, title and currency always come from this service, never from the client.
    course-service-url: ${COURSE_SERVICE_URL:http://localhost:8082}
    receipts-dir: ${RECEIPTS_DIR:./data/receipts}

  outbox:
    poller:
      # Enabled in every real environment; the HTTP tests turn it off so their outbox assertions
      # still see the rows before publication.
      enabled: ${OUTBOX_POLLER_ENABLED:true}
      fixed-delay-ms: 1000
